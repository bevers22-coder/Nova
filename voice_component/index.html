<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #c9faff;
      background: transparent;
      font: 12px "IBM Plex Mono", "Courier New", monospace;
    }
    .control {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 8px 12px;
      border: 1px solid rgba(8, 245, 239, .3);
      background: linear-gradient(110deg, rgba(4, 33, 43, .95), rgba(3, 15, 23, .95));
      overflow: hidden;
    }
    .visualizer {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 28px;
      margin-left: auto;
    }
    .visualizer span {
      width: 3px;
      height: 5px;
      border-radius: 2px;
      background: #08f5ef;
      opacity: .48;
      animation: idle-pulse 1.8s ease-in-out infinite;
    }
    .visualizer span:nth-child(2n) { animation-delay: -.6s; }
    .visualizer span:nth-child(3n) { animation-delay: -.9s; }
    .control.listening .visualizer span {
      opacity: 1;
      animation-name: voice-pulse;
      animation-duration: .42s;
      box-shadow: 0 0 8px rgba(8,245,239,.75);
    }
    .control.speaking .visualizer span {
      opacity: 1;
      animation-name: voice-pulse;
      animation-duration: .7s;
      box-shadow: 0 0 8px rgba(8,245,239,.75);
    }
    @keyframes idle-pulse {
      50% { height: 11px; opacity: .8; }
    }
    @keyframes voice-pulse {
      0%, 100% { height: 5px; }
      50% { height: 25px; }
    }
    button {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border: 1px solid #08f5ef;
      border-radius: 50%;
      color: #08f5ef;
      background: #04151c;
      font-size: 19px;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(8, 245, 239, .12);
    }
    button:hover, button:focus-visible {
      color: #02090e;
      background: #08f5ef;
      outline: none;
    }
    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    #speak {
      width: auto;
      height: 34px;
      flex: 0 0 auto;
      padding: 0 10px;
      border-radius: 2px;
      font: 600 10px "IBM Plex Mono", "Courier New", monospace;
      letter-spacing: .08em;
    }
    #speak[hidden] { display: none; }
    #status {
      color: #78b9c3;
      line-height: 1.5;
    }
    .live { color: #08f5ef !important; }
  </style>
</head>
<body>
  <div class="control" id="control">
    <button id="talk" type="button" aria-label="Start voice recognition" title="Start voice recognition">◉</button>
    <div id="status" role="status" aria-live="polite">VOICE LINK STANDBY / CLICK TO SPEAK</div>
    <button id="speak" type="button" hidden>▶ SPEAK ANSWER</button>
    <div class="visualizer" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>
  <script>
    const talk = document.getElementById("talk");
    const speak = document.getElementById("speak");
    const status = document.getElementById("status");
    const control = document.getElementById("control");
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let responseText = "";
    let activeUtterance = null;

    function setValue(value) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value,
        dataType: "json"
      }, "*");
    }

    function setHeight() {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: document.body.scrollHeight
      }, "*");
    }

    if (!SpeechRecognition) {
      talk.disabled = true;
      status.textContent = "VOICE LINK UNAVAILABLE / USE CHROME OR EDGE";
    }

    speak.addEventListener("click", () => {
      if (!responseText || !window.speechSynthesis) {
        status.textContent = "SPEECH OUTPUT UNAVAILABLE IN THIS BROWSER";
        return;
      }
      window.speechSynthesis.cancel();
      activeUtterance = new SpeechSynthesisUtterance(responseText);
      activeUtterance.onstart = () => control.classList.add("speaking");
      activeUtterance.onend = () => {
        control.classList.remove("speaking");
        status.textContent = "VOICE LINK STANDBY / CLICK TO SPEAK";
      };
      activeUtterance.onerror = () => {
        control.classList.remove("speaking");
        status.textContent = "SPEECH OUTPUT ERROR";
      };
      status.textContent = "NOVA SPEAKING";
      activeUtterance.lang = navigator.language || "en-US";
      window.speechSynthesis.speak(activeUtterance);
    });

    window.addEventListener("message", (event) => {
      const message = event.data;
      if (!message || message.type !== "streamlit:render" || !message.args) return;
      const nextResponse = String(message.args.response_text || "");
      if (nextResponse && nextResponse !== responseText) {
        responseText = nextResponse;
        speak.hidden = false;
        setHeight();
      }
    });

    talk.addEventListener("click", () => {
      if (!SpeechRecognition) return;
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      talk.disabled = true;
      status.textContent = "MIC ACTIVE / SPEAK A COMPANY OR TICKER";
      status.classList.add("live");
      control.classList.add("listening");

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim();
        if (transcript) {
          status.textContent = `CAPTURED / ${transcript}`.slice(0, 180);
          setValue({ status: "captured", transcript });
        } else {
          status.textContent = "NO SPEECH DETECTED / CLICK TO TRY AGAIN";
          setValue({ status: "error", message: "no speech detected" });
        }
      };
      recognition.onerror = (event) => {
        status.textContent = `VOICE ERROR / ${event.error}`;
        setValue({ status: "error", message: event.error });
      };
      recognition.onend = () => {
        talk.disabled = false;
        status.classList.remove("live");
        control.classList.remove("listening");
      };

      try {
        recognition.start();
      } catch (error) {
        talk.disabled = false;
        status.classList.remove("live");
        control.classList.remove("listening");
        status.textContent = "VOICE LINK ERROR / CLICK TO RETRY";
        setValue({ status: "error", message: error.message });
      }
    });

    window.addEventListener("load", () => {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
      }, "*");
      setHeight();
    });
  </script>
</body>
</html>
